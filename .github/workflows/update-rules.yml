name: Update ClearURLs rules

on:
  schedule:
    # 每日 UTC 03:17（台北時間 11:17）
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  update:
    name: 偵測上游規則更新並開 PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 腳本零相依，這一步不需要 npm install
      - name: 下載並以 sha256 驗證上游規則
        run: node scripts/update-rules.mjs

      - name: 判斷規則是否有變更
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo '規則無變更，後續步驟略過。'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # 針對「新下載的規則」執行測試。
      # 這裡刻意不讓失敗中斷 job——測試結果要能寫進 PR，PR 才有得看。
      - name: 對新規則執行測試
        id: tests
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      - name: 開 PR 並回報測試結果
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail

          hash8="$(cut -c1-8 data/rules.hash)"
          branch="chore/clearurls-rules-${hash8}"

          # 同一個上游版本只開一次 PR，避免每日重複
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "分支 $branch 已存在，代表這個版本的 PR 已經開過，結束。"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git switch -c "$branch"
          git add data/
          git commit -m "chore: update ClearURLs rules to ${hash8}"
          git push -u origin "$branch"

          sha="$(git rev-parse HEAD)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 取出 vitest 的結果摘要（去掉 ANSI 色碼）
          summary="$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test-output.txt" \
            | grep -E '^ *Tests ' | tail -1 | sed 's/^ *//' || true)"
          summary="${summary:-測試未能產出結果，請查看 workflow log}"

          if [ "$TESTS_OUTCOME" = 'success' ]; then
            state='success'
            title="chore: update ClearURLs rules (${hash8})"
            verdict="✅ 測試通過 — ${summary}"
          else
            state='failure'
            title="chore: update ClearURLs rules (${hash8}) — 測試未通過"
            verdict="❌ **測試未通過** — ${summary}。合併前請先確認上游規則變動造成的影響。"
          fi

          body="$(cat <<EOF
          上游 [ClearURLs/Rules](https://github.com/ClearURLs/Rules) 規則集有更新。

          - 來源：官方發佈的 \`data.minify.json\`
          - sha256：\`$(cat data/rules.hash)\`
          - 已通過 sha256 驗證與結構檢查

          ## 測試結果

          ${verdict}

          [完整 workflow log](${run_url})

          ---

          此 PR 由排程 workflow 自動建立。因為分支是以 \`GITHUB_TOKEN\` 推送的，
          GitHub 不會為它觸發 \`ci.yml\`，所以測試改在本 workflow 內執行、
          並以 commit status 回報到上方的檢查列。
          EOF
          )"

          gh pr create --base main --head "$branch" --title "$title" --body "$body"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="$state" \
            -f context='unit tests' \
            -f description="$(printf '%.140s' "$summary")" \
            -f target_url="$run_url" >/dev/null

          echo "已開 PR，測試狀態：$state"

      # 必須排在開 PR 之後：PR 要先建立起來，才有地方看失敗詳情。
      # 若省略這步，continue-on-error 會讓整個 run 在 Actions 列表上顯示為綠色，
      # 測試失敗就只剩 PR 上的檢查標記能看見，容易被漏掉。
      - name: 測試失敗時將 job 標記為失敗
        if: steps.tests.outcome == 'failure'
        run: |
          echo '::error::新規則未通過測試，PR 已建立但請先確認影響再合併。'
          exit 1
