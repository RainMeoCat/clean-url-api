name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    name: 格式、Lint、型別檢查與測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 規則檔的 sha256 驗證：規則是 build 時 bundle 進 Worker 的，
      # 執行期沒有機會驗，所以壞掉的規則必須在這裡就擋下來
      - run: npm run verify:rules

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # 確認 Worker 仍可 bundle（dry-run，不部署）
      - run: npm run build
